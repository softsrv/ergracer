name: Build and publish Docker image

# Only fires on a version tag push (e.g. v1.2.3) — this repo builds and
# pushes to Docker Hub deliberately, not on every commit to main, so tagging
# a release is the explicit trigger to ship a new image.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: rowbot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # DaisyUI's standalone .mjs bundles are gitignored (see
      # `make daisyui-install`) and the Dockerfile COPYs them straight from
      # the build context rather than fetching them itself, so they must
      # exist on disk before the build runs — same as a local `make prod`
      # requires `make daisyui-install` to have been run first.
      - name: Fetch DaisyUI bundles
        run: |
          curl -sLo web/static/css/daisyui.mjs \
            https://github.com/saadeghi/daisyui/releases/latest/download/daisyui.mjs
          curl -sLo web/static/css/daisyui-theme.mjs \
            https://github.com/saadeghi/daisyui/releases/latest/download/daisyui-theme.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Derives image tags from the pushed git tag, e.g. refs/tags/v1.2.3 ->
      # docker.io/<user>/rowbot:v1.2.3 and :latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
