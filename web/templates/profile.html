{{define "title"}}Profile{{end}}

{{define "content"}}
<div class="space-y-6">

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title">Account</h2>
      <p class="text-base-content/70">{{.User.Email}}</p>
      <p class="text-xs text-base-content/50">Member since {{.User.CreatedAt.Time.Format "January 2, 2006"}}</p>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h3 class="card-title text-lg">Active Sessions</h3>
      <div hx-get="/auth/sessions" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
        <span class="loading loading-spinner loading-sm"></span>
      </div>
    </div>
  </div>

  <div class="card bg-base-100 shadow-xl border border-error">
    <div class="card-body">
      <p class="text-sm text-base-content/70">Permanently delete your account and all associated data. This cannot be undone.</p>

      <div id="delete-result" class="mt-2"></div>

      <form hx-post="/profile/delete"
            hx-target="#delete-result"
            hx-swap="innerHTML"
            hx-confirm="Are you sure you want to permanently delete your account? This cannot be undone."
            class="mt-4">
        <button type="submit" class="btn btn-error btn-outline w-full">Delete Account</button>
      </form>
    </div>
  </div>

</div>
{{end}}
