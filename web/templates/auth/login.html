{{define "title"}}Sign In{{end}}

{{define "content"}}
<div class="card bg-base-100 shadow-xl">
  <div class="card-body">
    <h2 class="card-title text-2xl justify-center mb-4">Sign In</h2>

    <div id="form-error"></div>

    <form hx-post="/auth/login"
          hx-target="#form-error"
          hx-swap="innerHTML"
          class="space-y-4">
      <div class="form-control">
        <label class="label" for="email">
          <span class="label-text">Email</span>
        </label>
        <input id="email" name="email" type="email" required
               class="input input-bordered w-full"
               autocomplete="email" />
      </div>

      <div class="form-control">
        <label class="label" for="password">
          <span class="label-text">Password</span>
        </label>
        <input id="password" name="password" type="password" required
               class="input input-bordered w-full"
               autocomplete="current-password" />
        <label class="label">
          <a href="/forgot-password" class="label-text-alt link link-hover">Forgot password?</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>

    <div class="divider">OR</div>

    <a href="/auth/discord/login" class="btn btn-outline w-full gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </svg>
      Continue with Discord
    </a>

    <p class="text-center text-sm mt-4">
      Don't have an account?
      <a href="/register" class="link link-primary">Sign up</a>
    </p>
  </div>
</div>
{{end}}
